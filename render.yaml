services:
  - type: web
    name: beskarfolio-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: PRICE_PROVIDER
        value: auto
      - key: CORS_ORIGINS
        value: https://beskarfolio.onrender.com
      - key: TRUSTED_HOSTS
        value: beskarfolio-api.onrender.com
      - key: LOG_LEVEL
        value: INFO
      # Set the value in the Render dashboard; sync: false keeps it out of git
      - key: TWELVE_DATA_API_KEY
        sync: false

  - type: web
    name: beskarfolio
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://beskarfolio-api.onrender.com
      # Disables silent 30-min auto-refresh so visitor traffic doesn't burn
      # the Twelve Data quota. Manual "Update Prices" button still works.
      - key: VITE_DEMO_MODE
        value: "true"
      # Analytics tag injected at build time by frontend/scripts/inject-analytics.mjs
      # Value lives in the Render dashboard so the tracking ID isn't in git.
      - key: ANALYTICS_SCRIPT
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
